name=DigiCDCFast
version=1.2.0
author=Ihsan Kehribar and Digistump LLC (DigiCDC), OBJECTIVE DEVELOPMENT Software GmbH (V-USB), Marco Carnut
maintainer=Marco Carnut <kikocarnut@gmail.com>
sentence=USB CDC serial port for the Digispark (ATtiny85) and Digispark Pro, without the throughput limits and bugs of DigisparkCDC.
paragraph=Fork of the DigisparkCDC library from the Digistump AVR core 1.7.5 with the same SerialUSB API. The original waits 5 ms after every byte written, 1 ms before every USB poll and sends a zero-length packet after every data packet, which caps output near 200 bytes/s; without them it reaches 8000 bytes/s. Also fixes receive stalls, lost data and flush(), keeps the host's line settings (baud()), and offers DigiCDCMedium.h with 2-byte packets for timing-sensitive sketches. Since 1.1.0 about 450 bytes of flash smaller, with buffer sizes a sketch can choose and an optional hook to refuse line settings. Needs the Digistump AVR core. Tested on Linux (PC, Raspberry Pi); Windows refuses low-speed USB serial devices.
category=Communication
url=https://github.com/marcocarnut/DigiCDCFast
architectures=avr
