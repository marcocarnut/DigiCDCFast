name=DigiCDCFast
version=1.0.0
author=Ihsan Kehribar and Digistump LLC (DigiCDC), OBJECTIVE DEVELOPMENT Software GmbH (V-USB), Marco Carnut
maintainer=Marco Carnut <kikocarnut@gmail.com>
sentence=USB CDC serial port for the Digispark (ATtiny85), without the throughput limits of DigisparkCDC.
paragraph=Fork of the DigisparkCDC library from the Digistump AVR core 1.7.5 with the same SerialUSB API. The original waits 5 ms after every byte written, 1 ms before every USB poll and sends a zero-length packet after every data packet, which caps output near 200 bytes/s; with these removed, a continuous dump reaches about 3750 bytes/s on Linux. Needs the Digistump AVR core.
category=Communication
